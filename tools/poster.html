<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポスター作成</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- html2canvas (For generating images) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
    }
    .font-pop {
      font-family: 'Mochiy Pop One', sans-serif;
    }
    /* 画像切り切り円形用 */
    .avatar-container {
      position: relative;
      overflow: hidden;
    }
    /* 編集可能エリアのホバー効果 */
    .editable-focus:hover {
      background-color: rgba(0, 0, 0, 0.05);
      border-radius: 4px;
      cursor: pointer;
    }
    /* スクロールバーのデザインを薄くおしゃれに */
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4 flex flex-col items-center justify-start select-none">

  <!-- メインコンテナ -->
  <div class="w-full max-w-4xl flex flex-col items-center">
    
    <!-- キャストボード本体 (この範囲を画像化する) -->
    <div id="capture-area" class="w-full aspect-[4/5] max-w-[700px] bg-gradient-to-b from-[#bfe6f7] via-[#bfe6f7] to-[#80c883] px-4 pt-3 pb-6 rounded-3xl shadow-xl flex flex-col justify-start relative overflow-hidden bg-cover bg-center" style="min-height: 850px;">
      
      <!-- 背景の雲のような装飾デコレーション (SVG) - 背景画像が設定された時にも干渉しないように配置 -->
      <div id="clouds-deco" class="absolute inset-0 pointer-events-none opacity-40">
        <svg class="absolute -top-10 -left-10 w-64 h-64 fill-white" viewBox="0 0 200 200">
          <path d="M100,50 C120,50 130,70 150,70 C170,70 180,90 170,110 C160,130 140,140 120,130 C100,140 80,140 60,130 C40,140 30,120 40,100 C30,80 40,50 70,60 C80,50 90,50 100,50 Z"/>
        </svg>
        <svg class="absolute top-1/2 -right-20 w-80 h-80 fill-white" viewBox="0 0 200 200">
          <path d="M100,50 C120,50 140,40 160,60 C180,80 170,110 160,130 C150,150 120,160 100,150 C80,160 50,150 40,130 C30,110 40,80 60,60 C80,40 90,50 100,50 Z"/>
        </svg>
        <svg class="absolute bottom-20 -left-20 w-72 h-72 fill-white" viewBox="0 0 200 200">
          <path d="M100,50 C120,50 130,70 150,70 C170,70 180,90 170,110 C160,130 140,140 120,130 C100,140 80,140 60,130 C40,140 30,120 40,100 C30,80 40,50 70,60 C80,50 90,50 100,50 Z"/>
        </svg>
      </div>

      <!-- ボード内コンテンツ -->
      <div class="relative z-10 w-full h-full flex flex-col justify-between flex-grow">
        
        <!-- ヘッダー：日付エリア -->
        <div class="w-full flex justify-center mb-2">
          <div class="bg-white/85 backdrop-blur-sm border-4 border-sky-200 rounded-full px-6 py-2 w-[90%] text-center shadow-md relative group">
            <!-- [日付 / DATE] を VRCふれあい動物園（緑色フォント）に調整 -->
            <div class="text-[12px] md:text-sm font-black text-emerald-600 tracking-wider font-pop">VRCふれあい動物園</div>
            <div class="flex items-center justify-center gap-2">
              <span id="date-text" class="text-xl md:text-2xl font-black text-slate-800 font-pop editable-focus px-2 py-0.5 outline-none min-w-[200px]" contenteditable="true">6/12 出演キャスト</span>
              <i data-lucide="pencil" class="w-4 h-4 text-slate-400 group-hover:text-slate-600 transition-colors"></i>
            </div>
          </div>
        </div>

        <!-- メイングリッド: 3つのエリア -->
        <div class="grid grid-cols-3 gap-2 flex-grow mb-3">
          
          <!-- みずべのなかま (青) -->
          <div class="bg-[#4198c6]/90 p-2 md:p-2.5 rounded-3xl flex flex-col items-center border-4 border-white/60 shadow-lg h-full justify-start">
            <h2 class="text-white text-xs sm:text-sm md:text-base lg:text-lg font-black font-pop tracking-wider drop-shadow-[0_2px_2px_rgba(0,0,0,0.5)] mb-1.5">みずべのなかま</h2>
            <!-- スクロールをカード部分のみで完結させるため高さを最大400px〜450pxに制限 -->
            <div id="group-1-cards" class="w-full flex flex-col gap-1 flex-grow justify-start overflow-y-auto custom-scrollbar h-[400px] md:h-[450px] pr-0.5">
              <!-- JSでカードが動的に生成されます -->
            </div>
          </div>

          <!-- 猛獣館 (赤) -->
          <div class="bg-[#ef3c42]/90 p-2 md:p-2.5 rounded-3xl flex flex-col items-center border-4 border-white/60 shadow-lg h-full justify-start">
            <h2 class="text-white text-xs sm:text-sm md:text-base lg:text-lg font-black font-pop tracking-wider drop-shadow-[0_2px_2px_rgba(0,0,0,0.5)] mb-1.5">猛獣館</h2>
            <div id="group-2-cards" class="w-full flex flex-col gap-1 flex-grow justify-start overflow-y-auto custom-scrollbar h-[400px] md:h-[450px] pr-0.5">
              <!-- JSでカードが動的に生成されます -->
            </div>
          </div>

          <!-- もふもふパーク (緑) -->
          <div class="bg-[#3e8b65]/90 p-2 md:p-2.5 rounded-3xl flex flex-col items-center border-4 border-white/60 shadow-lg h-full justify-start">
            <h2 class="text-white text-xs sm:text-sm md:text-base lg:text-lg font-black font-pop tracking-wider drop-shadow-[0_2px_2px_rgba(0,0,0,0.5)] mb-1.5">もふもふパーク</h2>
            <div id="group-3-cards" class="w-full flex flex-col gap-1 flex-grow justify-start overflow-y-auto custom-scrollbar h-[400px] md:h-[450px] pr-0.5">
              <!-- JSでカードが動的に生成されます -->
            </div>
          </div>

        </div>

        <!-- フッターエリア: 送信者 & メッセージ -->
        <div class="flex flex-col md:flex-row gap-3 items-end w-full mt-auto">
          
          <!-- 送信者ブロック -->
          <div class="w-full md:w-[35%] bg-white/90 backdrop-blur-sm p-3 rounded-2xl border-4 border-sky-100 shadow-md flex items-center gap-3">
            <div class="relative w-14 h-14 md:w-16 md:h-16 rounded-full bg-slate-300 border-2 border-slate-400 flex items-center justify-center overflow-hidden shrink-0 group">
              <img id="sender-avatar" class="w-full h-full object-cover hidden" src="" alt="Sender Image">
              <div id="sender-placeholder" class="text-slate-500"><i data-lucide="camera" class="w-7 h-7"></i></div>
              <button onclick="triggerFileInput('sender-file-input')" class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white text-xs">
                <i data-lucide="edit-3" class="w-4 h-4"></i>
              </button>
              <input type="file" id="sender-file-input" class="hidden" accept="image/*" onchange="handleImageUpload(event, 'sender-avatar', 'sender-placeholder')">
            </div>
            <div class="flex-grow min-w-0">
              <div class="flex items-center gap-1">
                <div id="sender-name" class="font-black text-slate-800 editable-focus outline-none w-full block leading-normal min-h-[1.5rem]" contenteditable="true" placeholder="お名前を入力" onkeyup="adjustSenderNameSize()" oninput="adjustSenderNameSize()"></div>
                <i data-lucide="pencil" class="w-3.5 h-3.5 text-slate-400 shrink-0"></i>
              </div>
            </div>
          </div>

          <!-- メッセージ吹き出しブロック -->
          <div class="w-full md:w-[65%] bg-white rounded-2xl p-3 shadow-md border-4 border-sky-100 relative min-h-[90px] flex flex-col justify-center">
            <!-- 吹き出しのトゲ（三角形）要素を削除しました -->
            
            <!-- [メッセージ / MESSAGE] を [園長からの一言] に変更 -->
            <div class="text-[10px] font-black text-slate-500 mb-1 font-pop">[園長からの一言]</div>
            <div class="flex items-start gap-1">
              <div id="message-text" class="text-xs md:text-sm font-bold text-slate-700 w-full outline-none editable-focus leading-relaxed whitespace-pre-wrap" contenteditable="true">みんなの来園待ってるよ〜！
お気に入りの動物たちに会いにきてね！</div>
              <i data-lucide="pencil" class="w-3.5 h-3.5 text-slate-400 shrink-0 mt-0.5"></i>
            </div>
          </div>

        </div>

      </div>
    </div>

    <!-- アクションコントロールパネル -->
    <div class="w-full max-w-[700px] mt-6 flex flex-wrap gap-3 justify-center md:justify-end">
      <!-- 背景画像アップロードボタン -->
      <button onclick="triggerFileInput('bg-file-input')" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-black px-5 py-3 rounded-xl shadow-md transition-all active:scale-95 text-sm md:text-base">
        <i data-lucide="image" class="w-5 h-5"></i>
        <span>背景画像をアップロード</span>
      </button>
      <input type="file" id="bg-file-input" class="hidden" accept="image/*" onchange="handleBgUpload(event)">

      <!-- CSVインポートボタン -->
      <button onclick="triggerFileInput('csv-file-input')" class="flex items-center gap-2 bg-amber-600 hover:bg-amber-700 text-white font-black px-5 py-3 rounded-xl shadow-md transition-all active:scale-95 text-sm md:text-base">
        <i data-lucide="file-spreadsheet" class="w-5 h-5"></i>
        <span>CSVをインポート</span>
      </button>
      <input type="file" id="csv-file-input" class="hidden" accept=".csv,text/csv" onchange="handleCSVUpload(event)">

      <button onclick="saveTemplate()" class="flex items-center gap-2 bg-teal-600 hover:bg-teal-700 text-white font-black px-5 py-3 rounded-xl shadow-md transition-all active:scale-95 text-sm md:text-base">
        <i data-lucide="save" class="w-5 h-5"></i>
        <span>テンプレートを保存</span>
      </button>
      <button onclick="exportAsImage()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-black px-5 py-3 rounded-xl shadow-md transition-all active:scale-95 text-sm md:text-base">
        <i data-lucide="download" class="w-5 h-5"></i>
        <span>画像として書き出し</span>
      </button>
      <button onclick="openConfirmModal()" class="flex items-center gap-2 bg-slate-500 hover:bg-slate-600 text-white font-black px-5 py-3 rounded-xl shadow-md transition-all active:scale-95 text-sm md:text-base">
        <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
        <span>すべてをリセット</span>
      </button>
    </div>

  </div>

  <!-- リセット確認用カスタムモーダル -->
  <div id="confirm-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
    <div id="confirm-modal-content" class="bg-white rounded-3xl p-6 max-w-sm w-full mx-4 shadow-2xl border-4 border-slate-200 text-center transform scale-95 transition-transform duration-200">
      <h3 class="text-lg font-black text-slate-800 mb-2 font-pop">リセットの確認</h3>
      <p class="text-sm text-slate-600 mb-6 leading-relaxed">すべての編集内容をリセットして初期データに戻しますか？この操作は取り消せません。</p>
      <div class="flex gap-3 justify-center">
        <button onclick="closeConfirmModal()" class="px-5 py-2.5 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-700 font-black text-sm transition-colors active:scale-95">キャンセル</button>
        <button onclick="executeReset()" class="px-5 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-black text-sm shadow-md transition-colors active:scale-95">リセットする</button>
      </div>
    </div>
  </div>

  <!-- ステータス通知用トースト -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white font-bold px-6 py-3 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center gap-2">
    <span id="toast-message">メッセージ</span>
  </div>

  <script>
    // 完全に初期値が空で構築されるキャストデータ構造
    const defaultCasts = {
      group1: {
        staff: [{ name: "", role: "飼育員", img: "" }],
        kemo: [{ name: "", role: "ケモ", img: "" }]
      },
      group2: {
        staff: [{ name: "", role: "飼育員", img: "" }],
        kemo: [{ name: "", role: "ケモ", img: "" }]
      },
      group3: {
        staff: [{ name: "", role: "飼育員", img: "" }],
        kemo: [{ name: "", role: "ケモ", img: "" }]
      }
    };

    // 現在のアクティブなボードデータ
    let currentBoardData = JSON.parse(JSON.stringify(defaultCasts));

    // 背景画像URLの格納用グローバル変数
    let customBgBase64 = "";

    // 起動時にロードするメイン処理
    window.onload = function() {
      lucide.createIcons();
      loadBoardState();
      adjustSenderNameSize();
    };

    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    // 園長の名前の文字数に応じてフォントサイズを自動調整する
    // 引数：なし
    // 戻り値：なし
    // 例 : adjustSenderNameSize() => void
    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    function adjustSenderNameSize() {
      const el = document.getElementById('sender-name');
      const textLength = el.innerText.trim().length;
      
      let fontSize;
      if (textLength <= 4) {
        fontSize = '1rem'; // 16px
      } else if (textLength <= 6) {
        fontSize = '0.875rem'; // 14px
      } else if (textLength <= 10) {
        fontSize = '0.75rem'; // 12px
      } else if (textLength <= 14) {
        fontSize = '0.625rem'; // 10px
      } else {
        fontSize = '0.5rem'; // 8px
      }
      
      el.style.fontSize = fontSize;
    }

    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    // ボード全体のレンダリングを再実行する
    // 引数：data (Object) - レンダリング対象のボードデータ
    // 戻り値：なし
    // 例 : renderBoard(currentBoardData) => void
    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    function renderBoard(data = defaultCasts) {
      currentBoardData = data;
      renderGroup('group-1-cards', data.group1, 'group1');
      renderGroup('group-2-cards', data.group2, 'group2');
      renderGroup('group-3-cards', data.group3, 'group3');
      lucide.createIcons();
    }

    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    // 飼育員とケモに分類されたカードリストを余白を挟んで描画する
    // 引数：containerId (string), groupData (Object), groupKey (string)
    // 戻り値：なし
    // 例 : renderGroup('group-1-cards', {staff: [], kemo: []}, 'group1') => void
    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    function renderGroup(containerId, groupData, groupKey) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      const staffList = groupData.staff || [];
      const kemoList = groupData.kemo || [];
      const totalCount = staffList.length + kemoList.length;
      const sizeClasses = getGroupCardSettings(totalCount);

      // 1. 飼育員リストの描画
      staffList.forEach((cast, index) => {
        container.insertAdjacentHTML('beforeend', generateCardHtml(groupKey, 'staff', index, cast, sizeClasses));
      });

      // 飼育員追加用ボタン
      container.insertAdjacentHTML('beforeend', `
        <button onclick="addCast('${groupKey}', 'staff')" class="action-btn w-full py-0.5 border-2 border-dashed border-white/40 hover:border-white/80 rounded-xl text-[9px] font-black text-white/60 hover:text-white transition-all flex items-center justify-center gap-1 mt-0.5">
          <i data-lucide="plus" class="w-3 h-3"></i>
          <span>追加</span>
        </button>
      `);

      // 2. 飼育員とケモの間の仕切り
      container.insertAdjacentHTML('beforeend', `
        <div class="w-full flex items-center justify-center py-1 opacity-50 select-none">
          <div class="border-t-2 border-dashed border-white/30 w-full"></div>
        </div>
      `);

      // 3. ケモリストの描画
      kemoList.forEach((cast, index) => {
        container.insertAdjacentHTML('beforeend', generateCardHtml(groupKey, 'kemo', index, cast, sizeClasses));
      });

      // ケモ追加用ボタン
      container.insertAdjacentHTML('beforeend', `
        <button onclick="addCast('${groupKey}', 'kemo')" class="action-btn w-full py-0.5 border-2 border-dashed border-white/40 hover:border-white/80 rounded-xl text-[9px] font-black text-white/60 hover:text-white transition-all flex items-center justify-center gap-1 mt-0.5">
          <i data-lucide="plus" class="w-3 h-3"></i>
          <span>追加</span>
        </button>
      `);
    }

    function getGroupCardSettings(totalCount) {
      if (totalCount <= 6) {
        return {
          wrapper: 'p-1 min-h-[46px] md:min-h-[52px]',
          role: 'text-[9px] md:text-[10px]',
          name: 'text-[11px] md:text-sm'
        };
      }

      if (totalCount <= 10) {
        return {
          wrapper: 'p-0.5 min-h-[40px] md:min-h-[46px]',
          role: 'text-[8px] md:text-[9px]',
          name: 'text-[10px] md:text-[11px]'
        };
      }

      if (totalCount <= 14) {
        return {
          wrapper: 'p-0.5 min-h-[36px] md:min-h-[42px]',
          role: 'text-[8px] md:text-[9px]',
          name: 'text-[9px] md:text-[10px]'
        };
      }

      return {
        wrapper: 'p-0.5 min-h-[32px] md:min-h-[38px]',
        role: 'text-[8px] md:text-[9px]',
        name: 'text-[9px] md:text-[10px]'
      };
    }

    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    // 単体のキャストカードのHTMLタグ構造を動的に生成する (高さを縮小し見切れを防ぐ)
    // 引数：groupKey (string), type (string), index (number), cast (Object)
    // 戻り値：string (生成されたHTML文字列)
    // 例 : generateCardHtml('group1', 'staff', 0, {name: '...', ...}) => HTML
    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    function generateCardHtml(groupKey, type, index, cast, sizeClasses = {}) {
      const cardId = `${groupKey}-${type}-${index}`;
      const hasImg = cast.img && cast.img.trim() !== "";
      const wrapperClass = sizeClasses.wrapper || 'p-2 min-h-[76px] md:min-h-[84px]';
      const roleClass = sizeClasses.role || 'text-[10px] md:text-[11px]';
      const nameClass = sizeClasses.name || 'text-[13px] md:text-base';
      
      const displayName = cast.name ? cast.name : `<span id="${cardId}-placeholder-text" class="text-slate-300 text-[10px] md:text-xs">キャスト名</span>`;
      const displayRole = cast.role ? cast.role : (type === 'staff' ? '飼育員' : 'ケモ');

      return `
        <div class="bg-white rounded-xl ${wrapperClass} flex items-start gap-2 shadow-sm border border-slate-100 relative group transition-all overflow-visible">
          
          <!-- 個別削除用ゴミ箱ボタン -->
          <button onclick="deleteCast('${groupKey}', '${type}', ${index})" class="action-btn absolute -top-1 -right-1 bg-rose-500 hover:bg-rose-600 text-white rounded-full p-0.5 shadow-md opacity-0 group-hover:opacity-100 transition-opacity z-20">
            <i data-lucide="trash-2" class="w-2.5 h-2.5"></i>
          </button>

          <!-- アバターサークル -->
          <div class="relative w-10 h-10 md:w-11 md:h-11 rounded-full bg-slate-200 border border-slate-300 flex items-center justify-center overflow-hidden shrink-0">
            <img id="${cardId}-avatar" class="w-full h-full object-cover ${hasImg ? '' : 'hidden'}" src="${cast.img || ''}" alt="Cast Avatar">
            <div id="${cardId}-placeholder" class="text-slate-400 ${hasImg ? 'hidden' : ''}">
              <i data-lucide="camera" class="w-4 h-4"></i>
            </div>
            <button onclick="triggerFileInput('${cardId}-file')" class="action-btn absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white">
              <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
            </button>
            <input type="file" id="${cardId}-file" class="hidden" accept="image/*" onchange="handleImageUpload(event, '${cardId}-avatar', '${cardId}-placeholder')">
          </div>

          <!-- 情報テキストエリア -->
          <div class="flex-grow min-w-0 flex flex-col justify-start gap-1">
            <p id="${cardId}-role" class="${roleClass} font-black text-slate-400 font-pop editable-focus px-1 max-w-[70px] outline-none leading-normal whitespace-nowrap overflow-visible" contenteditable="true" placeholder="役職">${displayRole}</p>
            <div class="flex items-start justify-between gap-1 w-full">
              <!-- キャスト名 -->
              <div onclick="editName('${cardId}')" class="w-full block cursor-pointer hover:bg-slate-50 rounded px-1 py-1 transition-colors overflow-visible">
                <p id="${cardId}-name" class="font-black ${nameClass} text-slate-700 w-full block leading-relaxed whitespace-normal overflow-visible">${displayName}</p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    // キャストをリストへ動的に追加する
    // 引数：groupKey (string), type (string)
    // 戻り値：なし
    // 例 : addCast('group1', 'kemo') => void
    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    function addCast(groupKey, type) {
      syncDataFromDOM();
      
      const newRole = type === 'staff' ? '飼育員' : 'ケモ';
      currentBoardData[groupKey][type].push({ name: "", role: newRole, img: "" });
      
      renderBoard(currentBoardData);
      showToast(`${newRole}枠を追加しました`);
    }

    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    // キャストをリストから削除する
    // 引数：groupKey (string), type (string), index (number)
    // 戻り値：なし
    // 例 : deleteCast('group1', 'staff', 2) => void
    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    function deleteCast(groupKey, type, index) {
      syncDataFromDOM();
      
      currentBoardData[groupKey][type].splice(index, 1);
      
      renderBoard(currentBoardData);
      showToast('キャスト枠を削除しました');
    }

    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    // 名前のテキストをクリックされた際にプロンプト経由で編集する
    // 引数：cardId (string)
    // 戻り値：なし
    // 例 : editName('group1-staff-0') => void
    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    function editName(cardId) {
      const nameEl = document.getElementById(`${cardId}-name`);
      
      const isPlaceholder = nameEl.innerHTML.includes('placeholder-text');
      const currentVal = isPlaceholder ? "" : nameEl.innerText;

      const newVal = prompt("キャスト名を入力してください:", currentVal);
      if (newVal !== null) {
        const trimmed = newVal.trim();
        if (trimmed === "") {
          nameEl.innerHTML = `<span id="${cardId}-placeholder-text" class="text-slate-300 text-[10px] md:text-xs">キャスト名</span>`;
        } else {
          nameEl.innerText = trimmed;
        }
        syncDataFromDOM();
      }
    }

    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    // 画面の入力欄から最新データ状態をグローバル変数（currentBoardData）に同期する
    // 引数：なし
    // 戻り値：なし
    // 例 : syncDataFromDOM() => void
    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    function syncDataFromDOM() {
      const groups = ['group1', 'group2', 'group3'];
      groups.forEach(gKey => {
        ['staff', 'kemo'].forEach(type => {
          const list = currentBoardData[gKey][type] || [];
          list.forEach((cast, idx) => {
            const cardId = `${gKey}-${type}-${idx}`;
            
            const roleEl = document.getElementById(`${cardId}-role`);
            const nameEl = document.getElementById(`${cardId}-name`);
            const imgEl = document.getElementById(`${cardId}-avatar`);

            if (roleEl) {
              const rText = roleEl.innerText.trim();
              cast.role = rText === "役職" ? "" : rText;
            }

            if (nameEl) {
              const isPlaceholder = nameEl.innerHTML.includes('placeholder-text');
              cast.name = isPlaceholder ? "" : nameEl.innerText.trim();
            }

            if (imgEl && !imgEl.classList.contains('hidden')) {
              cast.img = imgEl.src;
            } else {
              cast.img = "";
            }
          });
        });
      });
    }

    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    // ファイル選択インプットをクリックさせるトリガー
    // 引数：inputId (string) - ファイル入力タグのID
    // 戻り値：なし
    // 例 : triggerFileInput('group1-card-0-file') => void
    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    function triggerFileInput(inputId) {
      document.getElementById(inputId).click();
    }

    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    // 画像ファイルを読み込みBase64としてアバターに設定する
    // 引数：event (Event), imgId (string), placeholderId (string)
    // 戻り値：なし
    // 例 : handleImageUpload(event, 'group1-avatar-0', 'placeholder') => void
    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    function handleImageUpload(event, imgId, placeholderId) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const imgElement = document.getElementById(imgId);
        const placeholderElement = document.getElementById(placeholderId);
        
        imgElement.src = e.target.result;
        imgElement.classList.remove('hidden');
        placeholderElement.classList.add('hidden');
        syncDataFromDOM();
      };
      reader.readAsDataURL(file);
    }

    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    // アップロードされた背景用画像をボード全体の背景に設定する
    // 引数：event (Event)
    // 戻り値：なし
    // 例 : handleBgUpload(event) => void
    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    function handleBgUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Data = e.target.result;
        applyBackgroundStyle(base64Data);
        showToast('背景画像を設定しました！');
      };
      reader.readAsDataURL(file);
      event.target.value = '';
    }

    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    // ボード本体に背景画像スタイルを適用・格納する
    // 引数：base64Data (string) - 画像のBase64文字列
    // 戻り値：なし
    // 例 : applyBackgroundStyle('data:image...') => void
    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    function applyBackgroundStyle(base64Data) {
      const target = document.getElementById('capture-area');
      const cloudsDeco = document.getElementById('clouds-deco');
      if (base64Data) {
        customBgBase64 = base64Data;
        target.style.backgroundImage = `url('${base64Data}')`;
        cloudsDeco.classList.add('opacity-10');
      } else {
        customBgBase64 = "";
        target.style.backgroundImage = '';
        cloudsDeco.classList.remove('opacity-10');
      }
    }

    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    // トースト通知を一時的に表示する
    // 引数：message (string) - 表示メッセージ内容
    // 戻り値：なし
    // 例 : showToast("保存しました") => void
    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      toastMsg.textContent = message;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }

    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    // CSVファイルをアップロードした際のパース及び反映イベントハンドラ
    // 引数：event (Event)
    // 戻り値：なし
    // 例 : handleCSVUpload(event) => void
    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    function handleCSVUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const text = e.target.result;
        parseAndApplyCSV(text);
      };
      reader.readAsText(file, 'utf-8');
      event.target.value = '';
    }

    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    // CSVの文字列データを解析し、3つのグループに適切に分配して画面をリビルドする
    // 引数：csvText (string) - CSVのテキスト全文
    // 戻り値：なし
    // 例 : parseAndApplyCSV(text) => void
    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    function parseAndApplyCSV(csvText) {
      const lines = csvText.split(/\r?\n/);
      if (lines.length < 2) {
        showToast('CSVデータが不足しているか、空ファイルです。');
        return;
      }

      let detectedDate = "";
      let headerIndex = -1;

      for (let i = 0; i < lines.length; i++) {
        const columns = parseCSVLine(lines[i]);
        
        if (columns.includes("担当") && columns.includes("VRC表示名")) {
          headerIndex = i;
          if (i > 0) {
            const aboveColumns = parseCSVLine(lines[i - 1]);
            const dateCandidate = aboveColumns.find(col => col.trim().match(/^\d+[\/\-]\d+$/) || col.trim().includes("月") || col.trim().match(/^\d+$/));
            if (dateCandidate) {
              detectedDate = dateCandidate.trim();
            }
          }
          break;
        }
      }

      if (headerIndex === -1) {
        headerIndex = 1;
      }

      const importedCasts = {
        group1: { staff: [], kemo: [] }, 
        group2: { staff: [], kemo: [] }, 
        group3: { staff: [], kemo: [] }  
      };

      let senderSet = false;

      for (let i = headerIndex + 1; i < lines.length; i++) {
        const cols = parseCSVLine(lines[i]);
        if (cols.length < 2 || !cols[0].trim()) continue; 

        const category = cols[0].trim(); 
        const name = cols[4] ? cols[4].trim() : (cols[1] ? cols[1].trim() : ""); 
        if (!name) continue;

        let imgUrl = "";
        if (cols[3] && (cols[3].trim().startsWith("http://") || cols[3].trim().startsWith("https://"))) {
          imgUrl = cols[3].trim();
        } else {
          for (let j = 0; j < cols.length; j++) {
            const colValue = cols[j].trim();
            if (colValue.startsWith("http://") || colValue.startsWith("https://")) {
              imgUrl = colValue;
              break; 
            }
          }
        }

        if ((category.includes("リーダー") || category.includes("ﾘｰﾀﾞｰ")) && !senderSet) {
          document.getElementById('sender-name').innerText = name;
          const sAvatar = document.getElementById('sender-avatar');
          const sPlaceholder = document.getElementById('sender-placeholder');
          
          if (imgUrl) {
            sAvatar.src = imgUrl;
            sAvatar.classList.remove('hidden');
            sPlaceholder.classList.add('hidden');
          } else {
            sAvatar.src = "";
            sAvatar.classList.add('hidden');
            sPlaceholder.classList.remove('hidden');
          }
          senderSet = true;
          adjustSenderNameSize();
          continue; 
        }

        const isKemoType = category.includes("ケモ");
        const role = isKemoType ? "ケモ" : (category.includes("リーダー") ? "飼育L" : "飼育員");
        const castObj = { name, role, img: imgUrl };

        if (category.includes("水辺") || category.includes("みずべ")) {
          if (isKemoType) {
            importedCasts.group1.kemo.push(castObj);
          } else {
            importedCasts.group1.staff.push(castObj);
          }
        } else if (category.includes("猛獣")) {
          if (isKemoType) {
            importedCasts.group2.kemo.push(castObj);
          } else {
            importedCasts.group2.staff.push(castObj);
          }
        } else if (category.includes("もふ") || category.includes("モフ")) {
          if (isKemoType) {
            importedCasts.group3.kemo.push(castObj);
          } else {
            importedCasts.group3.staff.push(castObj);
          }
        }
      }

      if (detectedDate) {
        document.getElementById('date-text').innerText = `${detectedDate} 出演キャスト`;
      }

      renderBoard(importedCasts);
      showToast('CSVからキャスト情報・役割・アバターを自動反映しました！');
    }

    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    // カンマ区切りのCSV一行分を、ダブルクォーテーションや改行を考慮して正しく配列に切り分ける
    // 引数：text (string) - CSV一行のデータ
    // 戻り値：Array (分割された文字列配列)
    // 例 : parseCSVLine('"A,B",C') => ["A,B", "C"]
    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    function parseCSVLine(text) {
      const result = [];
      let start = 0;
      let inQuotes = false;
      
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          let value = text.substring(start, i).trim();
          if (value.startsWith('"') && value.endsWith('"')) {
            value = value.substring(1, value.length - 1).replace(/""/g, '"');
          }
          result.push(value);
          start = i + 1;
        }
      }
      
      let lastValue = text.substring(start).trim();
      if (lastValue.startsWith('"') && lastValue.endsWith('"')) {
        lastValue = lastValue.substring(1, lastValue.length - 1).replace(/""/g, '"');
      }
      result.push(lastValue);
      
      return result;
    }

    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    // 現在のボードのデータ一式を取得する
    // 引数：なし
    // 戻り値：Object (現在のボード全データ)
    // 例 : captureCurrentData() => { date: "...", ... }
    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    function captureCurrentData() {
      syncDataFromDOM();
      
      return {
        date: document.getElementById('date-text').innerText,
        bgImage: customBgBase64,
        sender: {
          name: document.getElementById('sender-name').innerText,
          img: document.getElementById('sender-avatar').classList.contains('hidden') ? "" : document.getElementById('sender-avatar').src
        },
        message: document.getElementById('message-text').innerText,
        group1: currentBoardData.group1,
        group2: currentBoardData.group2,
        group3: currentBoardData.group3
      };
    }

    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    // 編集中の内容をローカルストレージへ即時保存する
    // 引数：なし
    // 戻り値：なし
    // 例 : saveTemplate() => void
    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    function saveTemplate() {
      const data = captureCurrentData();
      localStorage.setItem('cast_board_template', JSON.stringify(data));
      showToast('現在のテンプレートをブラウザに保存しました！');
    }

    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    // ローカルストレージに保存されたデータを読み込み適用する
    // 引数：なし
    // 戻り値：なし
    // 例 : loadBoardState() => void
    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    function loadBoardState() {
      const saved = localStorage.getItem('cast_board_template');
      if (saved) {
        try {
          const data = JSON.parse(saved);
          document.getElementById('date-text').innerText = data.date || "6/12 出演キャスト";
          document.getElementById('sender-name').innerText = data.sender?.name || "";
          
          if (data.bgImage) {
            applyBackgroundStyle(data.bgImage);
          } else {
            applyBackgroundStyle("");
          }

          if (data.sender?.img) {
            document.getElementById('sender-avatar').src = data.sender.img;
            document.getElementById('sender-avatar').classList.remove('hidden');
            document.getElementById('sender-placeholder').classList.add('hidden');
          } else {
            document.getElementById('sender-avatar').src = "";
            document.getElementById('sender-avatar').classList.add('hidden');
            document.getElementById('sender-placeholder').classList.remove('hidden');
          }

          document.getElementById('message-text').innerText = data.message || "";
          renderBoard(data);
          adjustSenderNameSize();
          return;
        } catch (e) {
          console.error("テンプレート復元失敗", e);
        }
      }
      renderBoard(defaultCasts);
    }

    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    // リセット確認モーダルを開く
    // 引数：なし
    // 戻り値：なし
    // 例 : openConfirmModal() => void
    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    function openConfirmModal() {
      const modal = document.getElementById('confirm-modal');
      const content = document.getElementById('confirm-modal-content');
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        content.classList.remove('scale-95');
        content.classList.add('scale-100');
      }, 10);
    }

    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    // リセット確認モーダルを閉じる
    // 引数：なし
    // 戻り値：なし
    // 例 : closeConfirmModal() => void
    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    function closeConfirmModal() {
      const modal = document.getElementById('confirm-modal');
      const content = document.getElementById('confirm-modal-content');
      modal.classList.add('opacity-0');
      content.classList.remove('scale-100');
      content.classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 200);
    }

    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    // 実際に初期データへリセット処理を実行する
    // 引数：なし
    // 戻り値：なし
    // 例 : executeReset() => void
    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    function executeReset() {
      localStorage.removeItem('cast_board_template');
      document.getElementById('date-text').innerText = "6/12 出演キャスト";
      document.getElementById('sender-name').innerText = "";
      document.getElementById('sender-avatar').src = "";
      document.getElementById('sender-avatar').classList.add('hidden');
      document.getElementById('sender-placeholder').classList.remove('hidden');
      document.getElementById('message-text').innerText = "みんなの来園待ってるよ〜！\nお気に入りの動物たちに会いにきてね！";
      
      applyBackgroundStyle(""); 
      renderBoard(JSON.parse(JSON.stringify(defaultCasts)));
      adjustSenderNameSize();
      closeConfirmModal();
      showToast('ボードを初期状態にリセットしました');
    }

    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    // html2canvasを用いてボードを画像データ(PNG)として書き出し、自動保存する
    // 引数：なし
    // 戻り値：なし
    // 例 : exportAsImage() => void
    //＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー＝ー
    function exportAsImage() {
      syncDataFromDOM();
      showToast('画像を生成中...');
      
      const actionButtons = document.querySelectorAll('.action-btn');
      actionButtons.forEach(btn => btn.style.display = 'none');

      const selection = window.getSelection();
      if (selection) {
        selection.removeAllRanges();
      }

      const target = document.getElementById('capture-area');
      
      const options = {
        scale: 2, 
        useCORS: true,
        backgroundColor: null,
        logging: false
      };

      html2canvas(target, options).then(canvas => {
        actionButtons.forEach(btn => btn.style.display = '');

        try {
          const imgData = canvas.toDataURL('image/png');
          const link = document.createElement('a');
          const dateText = document.getElementById('date-text').innerText.trim() || 'cast_board';
          link.download = `${dateText}.png`;
          link.href = imgData;
          link.click();
          showToast('画像をダウンロードしました！');
        } catch (err) {
          showToast('画像保存に失敗しました。');
          console.error(err);
        }
      });
    }
  </script>
</body>
</html>
